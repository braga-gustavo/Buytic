<mat-card class="product-card">
  <mat-card-header>
    <div mat-card-header-avatar class="product-avatar"></div>
    <mat-card-title>{{ produto.name }}</mat-card-title>
    <mat-card-subtitle> R$ {{produto.price}} </mat-card-subtitle>
  </mat-card-header>

<img mat-card-image [src]="produto.image" [alt]="produto.name">

<mat-card-content>
  <p>{{ produto.description }} </p>
  <span *ngIf="produto.badge" class="badge">{{ produto.badge }} </span>
</mat-card-content>

<mat-card-actions>
  <button mat-button color="primary">Ver detalhes </button>
</mat-card-actions>

</mat-card>
